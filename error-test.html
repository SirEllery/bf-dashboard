<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Error Catch Test</title>
    <style>
        body { margin: 0; background: #000; color: #f00; font-family: monospace; padding: 20px; }
        #error-log { white-space: pre-wrap; }
    </style>
</head>
<body>
    <div id="error-log">Waiting for errors...</div>
    
    <script>
        window.onerror = function(msg, url, line, col, error) {
            const log = document.getElementById('error-log');
            log.innerHTML += 'ERROR: ' + msg + '\\n';
            log.innerHTML += 'URL: ' + url + '\\n';
            log.innerHTML += 'Line: ' + line + ':' + col + '\\n';
            if (error) log.innerHTML += 'Stack: ' + error.stack + '\\n';
            log.innerHTML += '\\n---\\n\\n';
            return false;
        };
        
        // Also catch unhandled promise rejections
        window.onunhandledrejection = function(event) {
            const log = document.getElementById('error-log');
            log.innerHTML += 'PROMISE REJECTION: ' + event.reason + '\\n';
            log.innerHTML += '\\n---\\n\\n';
        };
        
        setTimeout(() => {
            const log = document.getElementById('error-log');
            if (log.innerHTML === 'Waiting for errors...') {
                log.innerHTML = 'No errors detected after 5 seconds.\\nCheck browser console for more details.';
            }
        }, 5000);
    </script>
    
    <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.162.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.162.0/examples/jsm/"
      }
    }
    </script>
    
    <script type="module" src="js/main.js?v=2"></script>
</body>
</html>
