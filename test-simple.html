<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Test</title>
    <style>
        body { margin: 0; background: #000; color: #0f0; font-family: monospace; padding: 20px; }
        #canvas { position: fixed; top: 0; left: 0; }
    </style>
</head>
<body>
    <div id="log">Starting...</div>
    <canvas id="canvas"></canvas>

    <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.162.0/build/three.module.js"
      }
    }
    </script>

    <script type="module">
        const log = document.getElementById('log');
        function logMsg(msg) {
            log.innerHTML += '<br>' + msg;
            console.log(msg);
        }

        try {
            logMsg('1. Loading Three.js...');
            import * as THREE from 'three';
            logMsg('2. Three.js loaded: v' + THREE.REVISION);

            logMsg('3. Creating scene...');
            const scene = new THREE.Scene();
            const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 1000);
            const canvas = document.getElementById('canvas');
            const renderer = new THREE.WebGLRenderer({ canvas });
            renderer.setSize(window.innerWidth, window.innerHeight);

            logMsg('4. Adding simple cube...');
            const geometry = new THREE.BoxGeometry(2, 2, 2);
            const material = new THREE.MeshBasicMaterial({ color: 0x00ff00 });
            const cube = new THREE.Mesh(geometry, material);
            scene.add(cube);

            camera.position.z = 5;

            logMsg('5. Starting render loop...');
            function animate() {
                cube.rotation.x += 0.01;
                cube.rotation.y += 0.01;
                renderer.render(scene, camera);
                requestAnimationFrame(animate);
            }
            animate();

            logMsg('SUCCESS: Basic Three.js working!');

        } catch (error) {
            logMsg('ERROR: ' + error.message);
            console.error(error);
        }
    </script>
</body>
</html>
