<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Diagnostic Test</title>
    <style>
        body { margin: 0; background: #000; color: #0f0; font-family: monospace; padding: 20px; }
        #log { white-space: pre-wrap; }
        #canvas { position: fixed; top: 0; left: 0; width: 100%; height: 100%; }
    </style>
</head>
<body>
    <div id="log">Starting diagnostic...</div>
    <canvas id="canvas"></canvas>

    <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.162.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.162.0/examples/jsm/"
      }
    }
    </script>

    <script type="module">
        const logEl = document.getElementById('log');
        function log(msg, type = 'info') {
            const color = type === 'error' ? '#f00' : type === 'success' ? '#0f0' : '#0f0';
            logEl.innerHTML += `<div style="color: ${color}">[${type.toUpperCase()}] ${msg}</div>`;
            console.log(msg);
        }

        try {
            log('Step 1: Importing Three.js...');
            const THREE = await import('three');
            log(`✓ Three.js loaded (revision ${THREE.REVISION})`, 'success');

            log('Step 2: Creating scene...');
            const scene = new THREE.Scene();
            scene.background = new THREE.Color(0x020208);
            log('✓ Scene created', 'success');

            log('Step 3: Creating camera...');
            const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 500);
            camera.position.set(20, 14, 30);
            log('✓ Camera created', 'success');

            log('Step 4: Creating renderer...');
            const canvas = document.getElementById('canvas');
            const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            log('✓ Renderer created', 'success');

            log('Step 5: Adding test cube...');
            const geometry = new THREE.BoxGeometry(2, 2, 2);
            const material = new THREE.MeshBasicMaterial({ color: 0x00ff00, wireframe: true });
            const cube = new THREE.Mesh(geometry, material);
            scene.add(cube);
            log('✓ Cube added to scene', 'success');

            log('Step 6: Starting render loop...');
            function animate() {
                requestAnimationFrame(animate);
                cube.rotation.x += 0.01;
                cube.rotation.y += 0.01;
                renderer.render(scene, camera);
            }
            animate();
            log('✓ Render loop started - you should see a spinning green wireframe cube', 'success');

            log('\\n=== DIAGNOSTIC COMPLETE ===', 'success');
            log('If you see a spinning green cube, Three.js is working correctly.');
            log('The issue is in the main.js code, not Three.js itself.');

        } catch (error) {
            log(`✗ ERROR: ${error.message}`, 'error');
            log(`Stack: ${error.stack}`, 'error');
        }
    </script>
</body>
</html>
