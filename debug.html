<!DOCTYPE html>
<html>
<head>
    <title>Debug Dashboard</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body>
    <div id="debug" style="font-family:monospace; padding:20px; background:#000; color:#0f0;">
        <h2>Loading Debug...</h2>
        <div id="log"></div>
    </div>
    
    <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.162.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.162.0/examples/jsm/"
      }
    }
    </script>
    
    <script type="module">
        const log = document.getElementById('log');
        function logMsg(msg) {
            log.innerHTML += '<div>' + msg + '</div>';
            console.log(msg);
        }
        
        try {
            logMsg('1. Starting imports...');
            
            const THREE = await import('three');
            logMsg('2. Three.js loaded: ' + THREE.REVISION);
            
            const cityModule = await import('./js/city.js?v=2');
            logMsg('3. City module loaded: ' + Object.keys(cityModule).join(', '));
            
            const cameraModule = await import('./js/camera.js?v=2');
            logMsg('4. Camera module loaded: ' + Object.keys(cameraModule).join(', '));
            
            logMsg('5. Creating scene...');
            const scene = new THREE.Scene();
            logMsg('6. Scene created');
            
            const { createCity } = cityModule;
            logMsg('7. Calling createCity...');
            const result = createCity(scene);
            logMsg('8. City created! Buildings: ' + Object.keys(result.buildingMeshes).length);
            
            logMsg('SUCCESS: All modules loaded and working!');
            
        } catch (error) {
            logMsg('ERROR: ' + error.message);
            logMsg('Stack: ' + error.stack);
        }
    </script>
</body>
</html>
