<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bath Foundry — Mission Control</title>
    <link rel="stylesheet" href="css/style.css?v=3">
    <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.162.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.162.0/examples/jsm/"
      }
    }
    </script>
</head>
<body>
    <div id="canvas-container"></div>

    <!-- Loading overlay -->
    <div id="loading-overlay">
        <div id="loading-content">
            <div id="loading-title">BATH FOUNDRY</div>
            <div id="loading-subtitle">Mission Control</div>
            <div id="loading-bar-container">
                <div id="loading-bar"></div>
            </div>
            <div id="loading-text">Initializing...</div>
        </div>
    </div>

    <!-- Hover tooltip -->
    <div id="hover-tooltip" class="hidden"></div>

    <!-- Breadcrumb nav -->
    <div id="breadcrumb">
        <span class="crumb active" data-level="city">City</span>
    </div>

    <!-- Perf counter -->
    <div id="perf">
        <span id="fps">-- fps</span>
        <span id="draws">-- draws</span>
        <span id="tris">-- tris</span>
    </div>

    <!-- Global Dock -->
    <div id="dock">
        <button class="dock-btn" data-target="scheduling">📅 Schedule</button>
        <button class="dock-btn" data-target="projects">📋 Active Jobs</button>
        <button class="dock-btn" data-target="pipeline" disabled>📊 Pipeline</button>
        <button class="dock-btn" data-target="tickets" disabled>🎫 Tickets</button>
    </div>

    <!-- Building Detail Panel -->
    <div id="detail-panel" class="hidden">
        <button id="detail-close" title="Close">&times;</button>
        <div id="detail-header">
            <div id="detail-icon"></div>
            <div id="detail-title-block">
                <h2 id="detail-name"></h2>
                <span id="detail-district"></span>
            </div>
            <span id="detail-beacon"></span>
        </div>
        <div id="detail-body"></div>
    </div>

    <!-- Command Palette -->
    <div id="cmd-palette" class="hidden">
        <input type="text" id="cmd-input" placeholder="Search buildings, metrics, actions..." autocomplete="off">
        <div id="cmd-results"></div>
    </div>

    <!-- Tour button -->
    <button id="tour-btn" title="Morning Brief Tour">▶ Tour</button>

    <!-- Floor selector (appears in interior mode) -->
    <div id="floor-selector" class="hidden">
        <button class="floor-btn" data-floor="ground">🔥 Ground</button>
        <button class="floor-btn" data-floor="mid">⚙️ Mid</button>
        <button class="floor-btn" data-floor="roof">📊 Roof</button>
    </div>

    <script type="module" src="js/main.js?v=7"></script>
</body>
</html>
